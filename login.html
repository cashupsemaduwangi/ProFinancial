<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profin - Masuk & Akses Pro</title>
    <link rel="icon" type="image/png" href="assets/logoCashupBg.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        min-height: 100vh;
      }
      .bg-blob {
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(59, 130, 246, 0.1);
        filter: blur(80px);
        border-radius: 50%;
        z-index: -1;
      }
      .tab-btn.active {
        background-color: #2563eb;
        color: #ffffff;
      }

      /* Sembunyikan ikon mata bawaan browser (Microsoft Edge / Chrome) */
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none !important;
      }
    </style>
  </head>
  <body class="flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
    <a
      href="index.html"
      class="absolute top-6 left-6 flex items-center gap-2 text-blue-600 font-bold hover:text-blue-800 transition-all group z-10 bg-white/50 py-2 px-4 rounded-full backdrop-blur-md shadow-sm border border-white"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
      <span>Beranda</span>
    </a>

    <div class="bg-blob top-0 left-0"></div>
    <div class="bg-blob bottom-0 right-0"></div>

    <div
      class="w-full max-w-5xl bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-blue-100 overflow-hidden flex flex-col md:flex-row min-h-[600px]"
    >
      <!-- Panel Kiri -->
      <div
        class="w-full md:w-1/2 bg-blue-600 p-10 flex flex-col justify-center items-center text-white text-center"
      >
        <div class="text-6xl font-extrabold tracking-tighter mb-4">
          Profin<span class="text-blue-200">.</span>
        </div>
        <p class="text-blue-100 text-lg max-w-xs font-medium">
          Kelola masa depan finansial Anda dengan platform yang profesional dan
          terpercaya.
        </p>
      </div>

      <!-- Panel Kanan (Form Toggle) -->
      <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
        <!-- Tab Selector Login / Register -->
        <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
          <button
            id="tabLoginBtn"
            onclick="switchTab('login')"
            class="tab-btn active w-1/2 py-2.5 rounded-lg font-bold text-sm transition-all text-gray-600"
          >
            Masuk
          </button>
          <button
            id="tabRegisterBtn"
            onclick="switchTab('register')"
            class="tab-btn w-1/2 py-2.5 rounded-lg font-bold text-sm transition-all text-gray-600"
          >
            Daftar Akun
          </button>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1"
              >Username</label
            >
            <input
              id="loginUsername"
              type="text"
              required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Username Anda"
            />
          </div>

          <div class="relative">
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-bold text-gray-700"
                >Password</label
              >
              <button
                type="button"
                onclick="openResetModal()"
                class="text-xs font-semibold text-blue-600 hover:underline"
              >
                Lupa Password?
              </button>
            </div>
            <input
              id="loginPassword"
              type="password"
              required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12"
              placeholder="••••••••"
            />
            <button
              type="button"
              onclick="
                togglePassword('loginPassword', 'eyeOffLogin', 'eyeOnLogin')
              "
              class="absolute right-4 top-9 text-gray-400 hover:text-blue-600 focus:outline-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <!-- Ikon Mata Disilang (Off) -->
                <path
                  id="eyeOffLogin"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 012.122-.063c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"
                />
                <!-- Ikon Mata Terbuka (On) -->
                <path
                  id="eyeOnLogin"
                  class="hidden"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="w-full bg-blue-600 text-white py-3 px-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex justify-center items-center gap-2"
          >
            <span>Masuk Ke Profin Pro</span>
          </button>
        </form>

        <!-- FORM REGISTRASI -->
        <form id="registerForm" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1"
              >Nama Lengkap</label
            >
            <input
              id="regNama"
              type="text"
              required
              class="w-full px-3 py-2 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Nama Lengkap"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1"
              >Username</label
            >
            <input
              id="regUsername"
              type="text"
              required
              class="w-full px-3 py-2 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Username tanpa spasi"
            />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1"
                >No. WhatsApp</label
              >
              <input
                id="regNoHp"
                type="tel"
                required
                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="08xxxxxxxxxx"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1"
                >Email</label
              >
              <input
                id="regEmail"
                type="email"
                required
                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="email@domain.com"
              />
            </div>
          </div>
          <div class="relative">
            <label class="block text-xs font-bold text-gray-700 mb-1"
              >Password</label
            >
            <input
              id="regPassword"
              type="password"
              required
              class="w-full px-3 py-2 bg-gray-50 border border-gray-200 text-gray-900 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
              placeholder="••••••••"
            />
            <button
              type="button"
              onclick="togglePassword('regPassword', 'eyeOffReg', 'eyeOnReg')"
              class="absolute right-3 top-7 text-gray-400 hover:text-blue-600 focus:outline-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <!-- Ikon Mata Disilang (Off) -->
                <path
                  id="eyeOffReg"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 012.122-.063c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"
                />
                <!-- Ikon Mata Terbuka (On) -->
                <path
                  id="eyeOnReg"
                  class="hidden"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>

          <button
            type="submit"
            id="regSubmitBtn"
            class="w-full bg-blue-600 text-white py-3 px-4 rounded-xl font-bold text-base hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex justify-center items-center gap-2 mt-2"
          >
            <span>Daftar Sekarang</span>
          </button>
        </form>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-4 bg-white text-gray-400 font-medium"
              >Atau Bantuan via WhatsApp</span
            >
          </div>
        </div>

        <a
          href="https://wa.me/6285331885155"
          target="_blank"
          class="w-full flex items-center justify-center py-2.5 px-4 border-2 border-gray-100 rounded-xl text-gray-700 font-bold bg-white hover:bg-gray-50 transition-all gap-3 text-sm"
        >
          <img
            src="assets/whatsapp.png"
            alt="WA"
            class="w-5 h-5 object-contain"
          />
          WhatsApp Admin
        </a>
      </div>
    </div>

    <!-- MODAL POPUP (ALERT & RESET PASSWORD) -->
    <div
      id="statusModal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all scale-100"
      >
        <div id="modalIcon" class="text-4xl mb-3">⚠️</div>
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800 mb-2">
          Informasi
        </h3>
        <p id="modalMessage" class="text-sm text-gray-600 mb-6"></p>
        <button
          onclick="closeModal()"
          class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold hover:bg-blue-700 transition-all"
        >
          Tutup
        </button>
      </div>
    </div>

    <div
      id="resetModal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4"
    >
      <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
        <h3 class="text-lg font-bold text-gray-800 mb-1">Ganti Password</h3>
        <p class="text-xs text-gray-500 mb-4">
          Masukkan Username dan Email Anda untuk konfirmasi pencocokan data.
        </p>

        <form id="resetForm" class="space-y-3">
          <input
            id="resetUsername"
            type="text"
            required
            placeholder="Username"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm"
          />
          <input
            id="resetEmail"
            type="email"
            required
            placeholder="Email Terdaftar"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm"
          />
          <input
            id="resetNewPassword"
            type="password"
            required
            placeholder="Password Baru"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm"
          />

          <div class="flex gap-2 pt-2">
            <button
              type="button"
              onclick="closeResetModal()"
              class="w-1/2 py-2 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm"
            >
              Batal
            </button>
            <button
              type="submit"
              id="resetSubmitBtn"
              class="w-1/2 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm"
            >
              Simpan Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
